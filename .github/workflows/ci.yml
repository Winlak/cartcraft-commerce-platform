name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
        env:
          DATABASE_URL: postgresql://cartcraft:cartcraft@localhost:5432/cartcraft?schema=public
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: postgresql://cartcraft:cartcraft@localhost:5432/cartcraft?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: local-ci-secret-at-least-sixteen-chars
          JWT_EXPIRES_IN: 2h
          MOCK_PAYMENT_WEBHOOK_SECRET: local-webhook-secret
          NEXT_PUBLIC_API_URL: http://localhost:4000/api
